<style>
  :root{
    --ground: #0b0a09;
    --ink: #f4efe9;
    --mute: #9c9088;
    --signal: #aa0000;
    --glow: #ff4a3d;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--ground);
    color: var(--ink);
  }

  body{
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem 1.5rem;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse 80% 45% at 50% 68%, rgba(20,17,16,0.9) 0%, transparent 100%),
      var(--ground);
  }

  main, .reflection{
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(1rem, 3vw, 1.6rem);
  }

  .reflection{
    transform: scaleY(-1);
    margin-top: -0.85rem;
    filter: blur(1.5px);
    opacity: 0.62;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.85) 38%, rgba(0,0,0,0.85) 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.85) 38%, rgba(0,0,0,0.85) 100%);
    pointer-events: none;
    user-select: none;
  }

  @media (max-width: 480px){
    .reflection{ margin-top: -0.6rem; }
  }

  .logo{
    width: clamp(200px, 34vw, 360px);
    height: auto;
    filter: drop-shadow(0 0 26px rgba(170, 0, 0, 0.28));
  }

  .eyebrow{
    display: inline-flex;
    align-items: center;
    gap: 0.55em;
    font-size: 0.74rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--mute);
  }

  .eyebrow .dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--glow);
    box-shadow: 0 0 10px var(--glow);
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse{
    0%, 100%{ opacity: 1; transform: scale(1); }
    50%{ opacity: 0.35; transform: scale(0.72); }
  }

  .terminal{
    margin-top: 0.2rem;
    font-size: clamp(0.78rem, 1.7vw, 0.92rem);
    color: var(--mute);
    min-height: 1.4em;
  }

  .terminal .prompt{ color: var(--signal); }
  .terminal .cursor{
    display: inline-block;
    width: 0.5em;
    margin-left: 0.05em;
    background: var(--glow);
    animation: blink 1s steps(1) infinite;
  }

  @keyframes blink{
    0%, 49%{ opacity: 1; }
    50%, 100%{ opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce){
    .eyebrow .dot{ animation: none; }
    .terminal .cursor{ animation: none; opacity: 1; }
  }

<script>
(function(){
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var hero = document.getElementById('hero');
  var reflection = document.getElementById('reflection');
  reflection.innerHTML = hero.innerHTML;
  reflection.removeAttribute('id');

  var phrases = [
    'compilando novas automações_',
    'desenhando a próxima campanha_',
    'construindo a nova versão do site_'
  ];
  var typedEls = document.querySelectorAll('.typed');
  function setTyped(text){
    typedEls.forEach(function(el){ el.textContent = text; });
  }

  if(reduceMotion){
    setTyped(phrases[0]);
  } else {
    var pi = 0, ci = 0, deleting = false;
    function step(){
      var current = phrases[pi];
      if(!deleting){
        ci++;
        setTyped(current.slice(0, ci));
        if(ci === current.length){
          deleting = true;
          setTimeout(step, 1600);
          return;
        }
        setTimeout(step, 42);
      } else {
        ci--;
        setTyped(current.slice(0, ci));
        if(ci === 0){
          deleting = false;
          pi = (pi + 1) % phrases.length;
          setTimeout(step, 350);
          return;
        }
        setTimeout(step, 22);
      }
    }
    step();
  }
})();
</script>
