<style>
  :root{ --ground:#0b0a09; --ink:#f4efe9; --mute:#9c9088; --neon:#b8261c; --neon-bright:#d94a3a; --line:rgba(244,239,233,.1);

  *{ box-sizing:border-box; }
  body{ margin:0; background:#1a1816; color:var(--ink); font-family:var(--sans); }
  .toolbar{ position:sticky; top:0; z-index:5; background:#141210; border-bottom:1px solid var(--line); padding:16px 24px;
    display:flex; gap:16px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .title{ font-family:var(--mono); font-weight:700; font-size:13px; letter-spacing:.06em; text-transform:uppercase; }
  .hint{ font-size:12.5px; color:#ffb4a8; }
  .layout{ display:flex; gap:40px; padding:40px; justify-content:center; align-items:flex-start; flex-wrap:wrap; }
  canvas{ width:405px; height:720px; border-radius:14px; box-shadow:0 30px 80px -30px rgba(0,0,0,.6); background:#000; display:block; }
  .side{ display:flex; flex-direction:column; gap:14px; width:360px; }
  .actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .btn{ font-family:var(--mono); font-weight:700; font-size:12.5px; background:var(--neon); color:#fff; border:none; padding:11px 20px; border-radius:999px; cursor:pointer; }
  .btn:hover{ background:var(--neon-bright); } .btn:disabled{ opacity:.5; cursor:default; }
  .btn.ghost{ background:transparent; border:1px solid rgba(244,239,233,.25); color:var(--ink); }
  input[type=range]{ width:100%; accent-color:var(--neon); }
  .status{ font-family:var(--mono); font-size:12px; color:var(--mute); min-height:18px; }
  .legenda{ background:#141210; border:1px solid var(--line); border-radius:14px; padding:16px; font-size:13px; line-height:1.6; white-space:pre-wrap; margin:0; }
</style>

const smoother = x => x * x * x * (x * (x * 6 - 15) + 10);
function orbit(k, t, t0){
  const a = k.a0 + (t - t0) * k.spin, R = k.R - (t - t0) * .18;
  return { pos:new THREE.Vector3(k.c[0] + Math.sin(a)*R, k.c[1] + k.h, k.c[2] + Math.cos(a)*R),
           tgt:new THREE.Vector3(k.c[0], k.c[1] + k.ty, k.c[2]) };
}
const pose = (ci, t) => orbit(CAMS[ci], t, CAM_T0[ci]);
function blend(a, b, k, lift, i){
  const e = smoother(k);
  return { pos:a.pos.lerp(b.pos, e).add(new THREE.Vector3(0, Math.sin(k * Math.PI) * lift, 0)), tgt:a.tgt.lerp(b.tgt, e),
           roll:Math.sin(k * Math.PI) * .06 * (i % 2 ? 1 : -1) };
}
function updateCamera(t){
  let ci = 0; for (const s of SCENES) if (t >= s.t0) ci = s.cam;
  let P = pose(ci, t); P.roll = 0;
  // abertura: orbita a logo do Claude e voa até o "3º"
  const tI = at("terceiro") - .45, ki = (t - tI) / 1.35;
  if (ki < 1){ const I = orbit(INTRO, t, 0); P = ki <= 0 ? Object.assign(I, { roll:0 }) : blend(I, P, ki, 3, 1); }
  // transições longas e contínuas entre cenas
  SCENES.forEach((s, i) => {
    if (!i) return;
    const k = (t - (s.t0 - .6)) / 1.7;
    if (k > 0 && k < 1) P = blend(pose(SCENES[i-1].cam, t), pose(s.cam, t), k, 4.5, i);
  });
  // micro-movimento orgânico (câmera "na mão", bem sutil)
  P.pos.x += Math.sin(t * 1.3) * .06 + Math.sin(t * 2.9) * .025;
  P.pos.y += Math.cos(t * 1.1) * .05 + Math.sin(t * 2.3) * .02;
  camera.position.copy(P.pos); camera.up.set(P.roll, 1, 0).normalize(); camera.lookAt(P.tgt);
}

function animate3D(t){
  A.dust.rotation.y = Math.sin(t * .05) * .02;
  // logo do Claude: entra girando, flutua e "respira"
  const ci = eBack(clamp((t - .15) / 1.1));
  A.claude.scale.setScalar(Math.max(.001, ci));
  A.claude.rotation.set(Math.sin(t * .9) * .12, -Math.PI * 1.5 * (1 - eOut(clamp((t - .15) / 1.6))) + Math.sin(t * .8) * .35, t * .15);
  A.claude.position.y = Math.sin(t * 1.4) * .12;
  A.claudeGlow.material.opacity = clamp(t * 2) * (.8 + .2 * Math.sin(t * 3));
  A.claudeRing.rotation.set(1.25 + Math.sin(t * .7) * .1, t * .4, 0); A.claudeRing.scale.setScalar(Math.max(.001, eOut(clamp((t - .4) / 1))));
  const n0 = at("terceiro") - .1;
  A.num.visible = t > n0;
  A.num.scale.setScalar(Math.max(.001, eBack(clamp((t - n0) / 1.0))));
  A.num.rotation.y = -1.6 * (1 - eOut(clamp((t - n0) / 1.6))) + Math.sin(t * .7) * .28;
  A.num.position.y = Math.sin(t * 1.2) * .15;
  A.orb.forEach(o => {
    const a = o.ph + t * o.sp;
    o.m.position.set(Math.cos(a) * o.r, o.y + Math.sin(t * .8 + o.ph) * .4, Math.sin(a) * o.r * .6);
    o.m.rotation.set(t * .7 + o.ph, t * .5, 0);
  });
  A.wires[0].rotation.set(t * .15, t * .2, 0); A.wires[1].rotation.set(-t * .25, t * .1, 0); A.wires[2].rotation.set(1.2, t * .12, t * .05);
  const drop = SCENES[2].t0 + .5, k = clamp((t - drop) / .75);
  A.pin.visible = t > drop;
  A.pin.position.y = -3 + 10 * (1 - eBounce(k));
  A.pin.rotation.y = t * .8;
  A.ripples.forEach((r, i) => {
    const ph = t - SCENES[2].t0 - 1.25 - i * .5;
    if (ph < 0){ r.material.opacity = 0; return; }
    const q = (ph % 1.5) / 1.5; r.scale.setScalar(1 + q * 4.5); r.material.opacity = .8 * (1 - q);
  });
  A.core.rotation.set(t * .2, t * .3, 0); A.core.scale.setScalar(1 + .04 * Math.sin(t * 3));
  A.shell.rotation.set(-t * .15, -t * .22, 0); A.shell2.rotation.set(t * .1, -t * .12, t * .05);
  const gIn = SCENES[5].t0 + .25, bIn = at("famoso") - .3, fall = at("depois") + .35;
  const kg = eOut(clamp((t - gIn) / 1.1)), m5 = eInOut(clamp((t - fall) / .9));
  A.good.visible = t > gIn;
  A.good.rotation.y = -.2 * (1 - m5) + (1 - kg) * Math.PI * .9;
  A.good.position.x = 2.1 - 1.6 * m5; A.good.scale.setScalar(1 + .08 * m5);
  const kb = eOut(clamp((t - bIn) / 1.0));
  A.bad.visible = t > bIn;
  A.bad.rotation.y = .2 - (1 - kb) * Math.PI * .9;
  A.badPivot.rotation.x = -1.45 * m5; A.badPivot.position.x = -2.1 - .8 * m5;
}
function toScreen(obj, local){
  const v = obj.localToWorld(local.clone()).project(camera);
  return { x:(v.x * .5 + .5) * W, y:(-v.y * .5 + .5) * H };
}
function screenBox(obj, pts){
  const s = pts.map(q => toScreen(obj, new THREE.Vector3(...q)));
  return { x0:Math.min(...s.map(q => q.x)), x1:Math.max(...s.map(q => q.x)), y0:Math.min(...s.map(q => q.y)), y1:Math.max(...s.map(q => q.y)) };
}

/* ---------- 2D: tipografia ---------- */
function words(str){
  const out = []; let hl = false;
  for (const raw of str.split(" ")){
    if (raw.startsWith("*")) hl = true;
    out.push({ w:raw.replace(/\*/g, ""), hl });
    if (raw.slice(1).includes("*")) hl = false;
  }
  return out;
}
function layout(ctx, str, o){
  const ws = words(o.upper ? str.toUpperCase() : str), sp = o.size * .26, lines = [{ ws:[], w:0 }];
  for (const wd of ws){
    ctx.font = `${wd.hl ? 900 : o.weight} ${o.size}px ${SANS}`;
    const width = ctx.measureText(wd.w).width;
    let L = lines[lines.length - 1];
    if (L.ws.length && L.w + sp + width > o.maxW){ L = { ws:[], w:0 }; lines.push(L); }
    if (L.ws.length) L.w += sp;
    wd.x = L.w; L.ws.push(wd); L.w += width;
  }
  return lines;
}
function text(ctx, t, str, o){
  o = Object.assign({ x:X0, size:70, weight:800, maxW:MAXW, lh:1.04, upper:true, color:C2.ink, hl:C2.neonB, start:0, stagger:.1, dur:.75 }, o);
  const lines = layout(ctx, str, o), lh = o.size * o.lh;
  ctx.letterSpacing = "0px"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  lines.forEach((L, i) => {
    const a = p(t, o.start + i * o.stagger, o.dur); if (a <= 0) return;
    const top = o.y + i * lh;
    ctx.save(); ctx.globalAlpha *= a;
    ctx.beginPath(); ctx.rect(0, top - o.size * .2, W, lh + o.size * .35); ctx.clip();
    ctx.translate(0, (1 - a) * lh);
    for (const wd of L.ws){
      ctx.font = `${wd.hl ? 900 : o.weight} ${o.size}px ${SANS}`;
      ctx.fillStyle = wd.hl ? o.hl : o.color; ctx.fillText(wd.w, o.x + wd.x, top + o.size * .82);
    }
    ctx.restore();
  });
  return lines.length * lh;
}
function mono(ctx, str, x, y, o = {}){
  ctx.font = `${o.weight || 600} ${o.size || 24}px ${MONO}`; ctx.letterSpacing = (o.ls ?? 3) + "px";
  ctx.fillStyle = o.color || C2.mute; ctx.textAlign = o.align || "left"; ctx.textBaseline = "middle"; ctx.fillText(str, x, y);
  ctx.letterSpacing = "0px";
}
const typed = (str, t, start, cps = 32) => str.slice(0, Math.max(0, Math.floor((t - start) * cps)));
const caret = t => Math.floor(t * 3) % 2 ? "▌" : " ";

function tag(ctx, t, label, y, start){
  const a = p(t, start, .5); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  ctx.shadowColor = C2.neon; ctx.shadowBlur = 14 + 8 * Math.sin(t * 4); ctx.fillStyle = C2.neonB;
  ctx.beginPath(); ctx.arc(X0 + 7, y, Math.max(0, 7 * eBack(clamp((t - start) / .5))), 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  mono(ctx, typed("> " + label.toUpperCase(), t, start, 40) + caret(t), X0 + 30, y + 1, { size:26, ls:4 });
  ctx.restore();
}
function brackets(ctx, x0, y0, x1, y1, len, col, lw = 3){
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath();
  ctx.moveTo(x0, y0 + len); ctx.lineTo(x0, y0); ctx.lineTo(x0 + len, y0);
  ctx.moveTo(x1 - len, y0); ctx.lineTo(x1, y0); ctx.lineTo(x1, y0 + len);
  ctx.moveTo(x1, y1 - len); ctx.lineTo(x1, y1); ctx.lineTo(x1 - len, y1);
  ctx.moveTo(x0 + len, y1); ctx.lineTo(x0, y1); ctx.lineTo(x0, y1 - len);
  ctx.stroke();
}
function hudPanel(ctx, x, y, w, h, title, t){
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 22); ctx.fillStyle = C2.panel; ctx.fill();
  ctx.strokeStyle = C2.line; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = C2.neonB; ctx.fillRect(x + 28, y, 90, 3);
  ctx.beginPath(); ctx.arc(x + 36, y + 40, 6, 0, 7); ctx.fill();
  mono(ctx, title, x + 56, y + 41, { size:22, ls:4, color:C2.ink, weight:700 });
  ctx.fillStyle = "rgba(244,239,233,.08)"; ctx.fillRect(x, y + 74, w, 1.5);
  // mini "sinal" animado no header
  for (let i = 0; i < 14; i++){
    const v = .3 + .7 * Math.abs(Math.sin(t * 3 + i * .9) * hash(i + Math.floor(t * 6)));
    ctx.fillStyle = i > 10 ? C2.neonB : "rgba(244,239,233,.35)"; ctx.fillRect(x + w - 40 - (13 - i) * 9, y + 50 - 24 * v, 5, 24 * v);
  }
}
// envelope de entrada/saída das camadas 2D de cada cena (zoom suave + blur)
function env(ctx, t, t0, t1, cx = W/2, cy = 800){
  const a = p(t, t0, .55), out = p(t, t1 - .4, .4, eInOut);
  if (a <= 0 || out >= 1) return false;
  const s = lerp(.94, 1, a) * (1 + .1 * out) * (1 + .015 * (t - t0));
  ctx.save(); ctx.globalAlpha = a * (1 - out);
  ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy);
  if (out > 0) ctx.filter = `blur(${12 * out}px)`;
  return true;
}

function drawClaude(ctx, x, y, size, col = CLAUDE_ORANGE, rot = 0){
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(size / 100, size / 100); ctx.translate(-50, -50);
  ctx.fillStyle = col; ctx.fill(CLAUDE_P); ctx.restore();
}
function drawAnthropic(ctx, x, y, width, col = C2.ink){
  const s = width / 1024.2; ctx.save(); ctx.translate(x, y - 57.5 * s); ctx.scale(s, s);
  ctx.fillStyle = col; ANTHROPIC_P.forEach(p => ctx.fill(p)); ctx.restore();
}
function drawFlag(ctx, code, x, y, w, h){
  ctx.save(); ctx.beginPath(); ctx.roundRect(x, y, w, h, 8); ctx.clip();
  if (code === "US"){
    for (let i = 0; i < 13; i++){ ctx.fillStyle = i % 2 ? "#ffffff" : "#b22234"; ctx.fillRect(x, y + i * h / 13, w, h / 13 + 1); }
    ctx.fillStyle = "#3c3b6e"; ctx.fillRect(x, y, w * .42, h * 7 / 13);
    ctx.fillStyle = "#fff"; for (let r = 0; r < 4; r++) for (let c = 0; c < 5; c++){ ctx.beginPath(); ctx.arc(x + 5 + c * w * .078, y + 5 + r * h * .13, 1.6, 0, 7); ctx.fill(); }
  } else if (code === "IN"){
    ["#ff9933", "#ffffff", "#138808"].forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(x, y + i * h / 3, w, h / 3 + 1); });
    ctx.strokeStyle = "#000080"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, h * .13, 0, 7); ctx.stroke();
  } else {
    ctx.fillStyle = "#009c3b"; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = "#ffdf00"; ctx.beginPath(); ctx.moveTo(x + w / 2, y + h * .1); ctx.lineTo(x + w * .92, y + h / 2); ctx.lineTo(x + w / 2, y + h * .9); ctx.lineTo(x + w * .08, y + h / 2); ctx.fill();
    ctx.fillStyle = "#002776"; ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, h * .24, 0, 7); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x + w / 2 + 2, y + h * .78, h * .36, Math.PI * 1.22, Math.PI * 1.72); ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(x, y, w, h, 8); ctx.stroke();
}

/* ---------- 2D: cenas ---------- */

const NET = Array.from({ length:46 }, (_, i) => ({ a:hash(i) * 6.283, r:200 + hash(i + 50) * 330, sp:(hash(i + 90) - .5) * .25, z:hash(i + 7) }));
function sceneCore(ctx, t){
  const S = SCENES[3];
  const c = toScreen(A.g4, new THREE.Vector3(0, 0, 0));
  if (!env(ctx, t, S.t0, SCENES[4].t1, c.x, c.y)) return;
  const pts = NET.map(n => { const a = n.a + t * n.sp; return { x:c.x + Math.cos(a) * n.r, y:c.y + Math.sin(a) * n.r * .8, z:n.z }; });
  const grow = p(t, S.t0, 1.4);
  ctx.lineWidth = 1.5;
  for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++){
    const d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
    if (d < 190){ ctx.strokeStyle = `rgba(217,74,58,${(1 - d / 190) * .45 * grow})`; ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke(); }
  }
  pts.forEach((q, i) => {
    ctx.fillStyle = q.z > .7 ? C2.neonB : "rgba(244,239,233,.75)";
    ctx.beginPath(); ctx.arc(q.x, q.y, (2.5 + q.z * 3) * grow, 0, 7); ctx.fill();
    if (i % 5 === 0){ // pulso viajando do núcleo até o nó

      ctx.fillStyle = `rgba(255,120,100,${(1 - f) * grow})`; ctx.beginPath(); ctx.arc(lerp(c.x, q.x, f), lerp(c.y, q.y, f), 4, 0, 7); ctx.fill();
    }
  });
  ctx.restore();
}

  mono(ctx, "T+" + t.toFixed(2).padStart(5, "0"), W - X0, 223, { size:18, ls:3, align:"right" });
  ctx.strokeStyle = "rgba(244,239,233,.18)"; ctx.lineWidth = 2;
  brackets(ctx, 40, 40, W - 40, H - 40, 40, "rgba(244,239,233,.18)", 2);
  ctx.globalAlpha = 1;

  // scanlines + faixa de varredura + grão
  scanPat = scanPat || ctx.createPattern(SCAN, "repeat"); ctx.globalAlpha = .35; ctx.fillStyle = scanPat; ctx.fillRect(0, 0, W, H);
  const by = ((t * .25) % 1) * (H + 300) - 150, sg = ctx.createLinearGradient(0, by - 120, 0, by + 120);
  sg.addColorStop(0, "rgba(255,255,255,0)"); sg.addColorStop(.5, "rgba(255,255,255,.035)"); sg.addColorStop(1, "rgba(255,255,255,0)");
  ctx.globalAlpha = 1; ctx.fillStyle = sg; ctx.fillRect(0, by - 120, W, 240);
  grainPat = grainPat || ctx.createPattern(NOISE, "repeat");
  ctx.globalAlpha = .05; ctx.translate(Math.random() * 256, Math.random() * 256); ctx.fillStyle = grainPat; ctx.fillRect(-256, -256, W + 256, H + 256);
  ctx.setTransform(Q, 0, 0, Q, 0, 0); ctx.globalAlpha = 1;

  // glitch nos cortes
  let g = 0; SCENES.forEach((s, i) => { if (i) g = Math.max(g, 1 - Math.abs(t - s.t0) / .16); });
  if (g > 0){
    const f = Math.floor(t * 30);

    ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  }

  // fade de abertura e de fechamento
  ctx.globalAlpha = Math.max(1 - p(t, 0, .6), p(t, END - .7, .7)); ctx.fillStyle = "#0b0a09"; ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

const AUDIO_BYTES = (() => { const bin = atob(AUDIO_B64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; })();

/* ---------- trilha cyberpunk sintetizada (autoral, sem direitos de terceiros) ---------- */
const SR = 48000;
function synth(oc, out, dur){
  const bpm = 108, beat = 60 / bpm, bar = beat * 4, step = beat / 4;
  const prog = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]]; // Am  F  C  G
  const roots = [45, 41, 36, 43];
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const comp = oc.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4; comp.connect(out);
  const pump = oc.createGain(); pump.connect(comp); // "sidechain": baixo e pad respiram com o bumbo
  const delay = oc.createDelay(1), fb = oc.createGain(), wet = oc.createGain();
  delay.delayTime.value = beat * .75; fb.gain.value = .35; wet.gain.value = .3;
  delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(comp);
  const nb = oc.createBuffer(1, SR, SR), nd = nb.getChannelData(0); for (let i = 0; i < SR; i++) nd[i] = Math.random() * 2 - 1;
  const noise = (ts, type, freq, q, vol, dec) => {
    const s = oc.createBufferSource(); s.buffer = nb; const f = oc.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = oc.createGain(); g.gain.setValueAtTime(vol, ts); g.gain.exponentialRampToValueAtTime(.0001, ts + dec);
    s.connect(f); f.connect(g); g.connect(comp); s.start(ts, Math.random() * .5); s.stop(ts + dec + .02);
  };
  const tone = (ts, type, m, vol, len, dest, fFrom, fTo, q = 1) => {
    const o = oc.createOscillator(); o.type = type; o.frequency.value = mtof(m);
    const f = oc.createBiquadFilter(); f.type = "lowpass"; f.Q.value = q; f.frequency.setValueAtTime(fFrom, ts); if (fTo) f.frequency.exponentialRampToValueAtTime(fTo, ts + len);
    const g = oc.createGain(); g.gain.setValueAtTime(.0001, ts); g.gain.exponentialRampToValueAtTime(vol, ts + .005); g.gain.exponentialRampToValueAtTime(.0001, ts + len);
    o.connect(f); f.connect(g); dest.forEach(d => g.connect(d)); o.start(ts); o.stop(ts + len + .02);
  };
  for (let b = 0; b * bar < dur; b++){
    const t0 = b * bar, chord = prog[b % 4], root = roots[b % 4];
    chord.forEach(m => [-8, 8].forEach(det => { // pad com saws desafinados
      const o = oc.createOscillator(); o.type = "sawtooth"; o.frequency.value = mtof(m); o.detune.value = det;
      const f = oc.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 650 + 500 * Math.min(1, b / 4);
      const g = oc.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.03, t0 + .5); g.gain.setValueAtTime(.03, t0 + bar - .2); g.gain.linearRampToValueAtTime(0, t0 + bar + .05);
      o.connect(f); f.connect(g); g.connect(pump); o.start(t0); o.stop(t0 + bar + .1);
    }));
    for (let s = 0; s < 16; s++){
      const ts = t0 + s * step; if (ts > dur) break;
      if (s % 2 === 0) tone(ts, "sawtooth", root + (s % 4 === 2 ? 12 : 0), .16, step * 1.8, [pump], 1900, 160, 6);   // baixo pulsante
      if (b >= 1) tone(ts, "square", chord[[0, 1, 2, 1][s % 4]] + 12 + (s >= 8 ? 12 : 0), .04, step * .9, [comp, delay], 2600); // arpejo
      if (s % 4 === 0){ // bumbo + bombeamento
        const o = oc.createOscillator(), g = oc.createGain(); o.frequency.setValueAtTime(150, ts); o.frequency.exponentialRampToValueAtTime(42, ts + .12);
        g.gain.setValueAtTime(.9, ts); g.gain.exponentialRampToValueAtTime(.0001, ts + .38); o.connect(g); g.connect(comp); o.start(ts); o.stop(ts + .4);
        pump.gain.setValueAtTime(.3, ts); pump.gain.linearRampToValueAtTime(1, ts + beat * .6);
      }
      if (s === 4 || s === 12){ noise(ts, "bandpass", 1800, .8, .35, .2); tone(ts, "triangle", 54, .12, .1, [comp], 4000); } // caixa
      noise(ts, "highpass", 7500, 1, s % 4 === 2 ? .07 : .025, s % 4 === 2 ? .06 : .03);                                  // chimbal
    }
  }
}
// mixa narração + trilha (trilha ~12 dB abaixo da voz, com fade no começo e no fim)
let MIX = null;
async function buildMix(){
  const len = Math.ceil(END * SR);
  const voice = await new OfflineAudioContext(1, 1, SR).decodeAudioData(AUDIO_BYTES.buffer.slice(0));
  // renderiza 5 compassos e repete os 4 últimos em loop (o áudio offline fica muito lento em trechos longos)
  const bar = 4 * 60 / 108, mc = new OfflineAudioContext(2, Math.ceil(5 * bar * SR), SR); synth(mc, mc.destination, 5 * bar);
  const seg = await mc.startRendering(), s0 = Math.round(bar * SR), sl = Math.round(4 * bar * SR);
  const tile = c => { const src = seg.getChannelData(c), o = new Float32Array(len); for (let i = 0; i < len; i++) o[i] = src[s0 + i % sl]; return o; };
  const music = { ch:[tile(0), tile(1)], getChannelData(c){ return this.ch[c]; } };
  const v = voice.getChannelData(0), off = Math.round(AOFF * SR);
  const rms = a => { let s = 0, n = 0; for (let i = 0; i < a.length; i += 7){ s += a[i] * a[i]; n++; } return Math.sqrt(s / n) || 1e-6; };
  const gm = .25 * rms(v) / rms(music.getChannelData(0));
  const L = new Float32Array(len), R = new Float32Array(len), mL = music.getChannelData(0), mR = music.getChannelData(1);
  let peak = 0;
  for (let i = 0; i < len; i++){
    const t = i / SR, env = Math.min(1, t / .8) * Math.min(1, (END - t) / 2.2);
    const vo = i >= off && i - off < v.length ? v[i - off] : 0;
    L[i] = vo + mL[i] * gm * env; R[i] = vo + mR[i] * gm * env;
    peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
  }
  if (peak > .95){ const k = .95 / peak; for (let i = 0; i < len; i++){ L[i] *= k; R[i] *= k; } }
  return MIX = { L, R, len };
}

// player (relógio do vídeo; o áudio toca do ponto atual)
let actx = null, src = null;
let playing = false, exporting = false, t0 = 0, scrubT = 0;
function play(from = scrubT){
  if (from >= END - .05) from = 0;
  actx = actx || new AudioContext({ sampleRate:SR });
  const buf = actx.createBuffer(2, MIX.len, SR); buf.copyToChannel(MIX.L, 0); buf.copyToChannel(MIX.R, 1);
  src = actx.createBufferSource(); src.buffer = buf; src.connect(actx.destination);
  actx.resume(); src.start(0, from);
  t0 = performance.now() - from * 1000; playing = true; $("play").textContent = "❚❚ Pausar";
}
function pause(){ if (src){ try { src.stop(); } catch {} src = null; } playing = false; $("play").textContent = "▶ Play com som"; }
$("play").onclick = () => playing ? pause() : play();
$("scrub").oninput = e => { pause(); scrubT = +e.target.value; };

function loop(now){
  if (!exporting){
    let t = playing ? (now - t0) / 1000 : scrubT;
    if (playing && t >= END){ t = END; scrubT = END; pause(); }
    if (playing){ scrubT = t; $("scrub").value = t; }
    drawFrame(ctx, t);
  }
  requestAnimationFrame(loop);
}

// exportação quadro a quadro: 60fps cravados, independente da velocidade do PC
const yieldUI = () => new Promise(r => { const c = new MessageChannel(); c.port1.onmessage = r; c.port2.postMessage(0); });
$("rec").onclick = async () => {
  if (!window.VideoEncoder || !window.Mp4Muxer){ status("Este navegador não suporta exportação (use Chrome ou Edge atualizado)."); return; }
  pause(); exporting = true; $("rec").disabled = $("play").disabled = true; setQuality(1);
  try {
    const vcfg = ["avc1.640033", "avc1.4d0033", "avc1.42003e"].map(codec => ({ codec, width:W, height:H, bitrate:16e6, framerate:FPS }));
    let vc = null; for (const c of vcfg) if ((await VideoEncoder.isConfigSupported(c)).supported){ vc = c; break; }
    if (!vc) throw new Error("codificador H.264 indisponível");
    const acfg = { codec:"mp4a.40.2", sampleRate:SR, numberOfChannels:2, bitrate:192000 };
    const hasAAC = window.AudioEncoder && (await AudioEncoder.isConfigSupported(acfg)).supported;

    const muxer = new Mp4Muxer.Muxer({ target:new Mp4Muxer.ArrayBufferTarget(), fastStart:"in-memory",
      video:{ codec:"avc", width:W, height:H, frameRate:FPS }, ...(hasAAC ? { audio:{ codec:"aac", sampleRate:SR, numberOfChannels:2 } } : {}) });
    const venc = new VideoEncoder({ output:(c, m) => muxer.addVideoChunk(c, m), error:e => { throw e; } });
    venc.configure(vc);
    if (hasAAC){
      const aenc = new AudioEncoder({ output:(c, m) => muxer.addAudioChunk(c, m), error:e => { throw e; } });
      aenc.configure(acfg);
      for (let i = 0; i < MIX.len; i += 4096){
        const n = Math.min(4096, MIX.len - i), data = new Float32Array(n * 2);
        data.set(MIX.L.subarray(i, i + n), 0); data.set(MIX.R.subarray(i, i + n), n);
        aenc.encode(new AudioData({ format:"f32-planar", sampleRate:SR, numberOfFrames:n, numberOfChannels:2, timestamp:Math.round(i / SR * 1e6), data }));
      }
      await aenc.flush(); aenc.close();
    }    const frames = Math.ceil(END * FPS);
    for (let i = 0; i < frames; i++){
      drawFrame(ctx, i / FPS);
      const fr = new VideoFrame(cv, { timestamp:Math.round(i * 1e6 / FPS), duration:Math.round(1e6 / FPS) });
      venc.encode(fr, { keyFrame:i % (FPS * 2) === 0 }); fr.close();
      while (venc.encodeQueueSize > 6) await new Promise(r => venc.addEventListener("dequeue", r, { once:true }));
      if (i % 3 === 0){ status(`Renderizando a 60fps… ${Math.round(i / frames * 100)}% — pode deixar a aba aberta`); await yieldUI(); }
    }
    await venc.flush(); venc.close(); muxer.finalize();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([muxer.target.buffer], { type:"video/mp4" }));
    a.download = "yra-motion-01-claude.mp4"; a.click();
    status(hasAAC ? "Pronto — MP4 60fps baixado." : "Pronto — MP4 baixado, mas SEM áudio (este navegador não codifica AAC).");
  } catch (e){ console.error(e); status("Erro na exportação: " + e.message); }
  setQuality(.5); exporting = false; $("rec").disabled = $("play").disabled = false;
};
(async () => {
  await Promise.all([400, 600, 800, 900].map(w => document.fonts.load(`${w} 80px Inter`)).concat([400, 600, 700].map(w => document.fonts.load(`${w} 30px "IBM Plex Mono"`))));
  LOGO = await new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = LOGO_SRC; });
  await init3D();
  setQuality(.5);
  // pré-aquece: compila shaders e sobe texturas de todas as cenas antes do play (evita soluços nas trocas)
  status("Preparando cenas e trilha…");
  await buildMix();
  renderer.compile(scene, camera);
  for (let t = 0; t < END; t += .5){ drawFrame(ctx, t); if (t % 4 < .5) await yieldUI(); }
  drawFrame(ctx, 0);
  status("Pronto. Clique em Play pra ver com a narração.");
  requestAnimationFrame(loop);
})();
</script>
