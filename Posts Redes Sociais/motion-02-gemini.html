<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YRA Motion 02 — Gemini grátis tem prazo de validade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;600;700;800;900&display=swap">
<style>
  :root{ --ground:#0b0a09; --ink:#f4efe9; --mute:#9c9088; --neon:#b8261c; --neon-bright:#d94a3a; --line:rgba(244,239,233,.1);
    --mono:"IBM Plex Mono",ui-monospace,monospace; --sans:"Inter",sans-serif; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#1a1816; color:var(--ink); font-family:var(--sans); }
  .toolbar{ position:sticky; top:0; z-index:5; background:#141210; border-bottom:1px solid var(--line); padding:16px 24px;
    display:flex; gap:16px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .title{ font-family:var(--mono); font-weight:700; font-size:13px; letter-spacing:.06em; text-transform:uppercase; }
  .hint{ font-size:12.5px; color:#ffb4a8; }
  .layout{ display:flex; gap:40px; padding:40px; justify-content:center; align-items:flex-start; flex-wrap:wrap; }
  canvas{ width:405px; height:720px; border-radius:14px; box-shadow:0 30px 80px -30px rgba(0,0,0,.6); background:#000; display:block; }
  .side{ display:flex; flex-direction:column; gap:14px; width:360px; }
  .actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .btn{ font-family:var(--mono); font-weight:700; font-size:12.5px; background:var(--neon); color:#fff; border:none; padding:11px 20px; border-radius:999px; cursor:pointer; }
  .btn:hover{ background:var(--neon-bright); } .btn:disabled{ opacity:.5; cursor:default; }
  .btn.ghost{ background:transparent; border:1px solid rgba(244,239,233,.25); color:var(--ink); }
  input[type=range]{ width:100%; accent-color:var(--neon); }
  .status{ font-family:var(--mono); font-size:12px; color:var(--mute); min-height:18px; }
  .legenda{ background:#141210; border:1px solid var(--line); border-radius:14px; padding:16px; font-size:13px; line-height:1.6; white-space:pre-wrap; margin:0; }
</style>
</head>
<body>
<header class="toolbar">
  <span class="title">YRA Motion 02 — Gemini grátis tem prazo de validade (1080×1920)</span>
  <span class="hint">Exporta em MP4 60fps quadro a quadro (leva ~1–3 min).</span>
</header>
<div class="layout">
  <canvas id="cv"></canvas>
  <div class="side">
    <div class="actions">
      <button class="btn" id="play">▶ Play com som</button>
      <button class="btn ghost" id="rec">Baixar vídeo</button>
    </div>
    <input type="range" id="scrub" min="0" max="60" step="0.01" value="0">
    <div class="status" id="status">Carregando…</div>
    <pre class="legenda" id="legenda"></pre>
    <button class="btn ghost" id="copy">Copiar legenda</button>
  </div>
</div>

// logo SVG extrudada em 3D (paths = string ou lista de "d"); stops = cores do degradê diagonal
function svgLogo3D(paths, vb, size, depth, stops){
  const ds = Array.isArray(paths) ? paths : [paths];
  const svg = new THREE.SVGLoader().parse(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${vb} ${vb}">${ds.map(d => `<path d="${d}"/>`).join("")}</svg>`);
  const geo = new THREE.ExtrudeGeometry(svg.paths.flatMap(p => THREE.SVGLoader.createShapes(p)),
    { depth:depth * vb / size, bevelEnabled:true, bevelThickness:vb * .02, bevelSize:vb * .011, bevelSegments:5, curveSegments:14 });
  geo.center(); geo.rotateX(Math.PI); geo.scale(size / vb, size / vb, size / vb);
  if (stops && stops.length > 1){
    geo.computeBoundingBox(); const b = geo.boundingBox, pos = geo.attributes.position, col = new Float32Array(pos.count * 3);
    const cs = stops.map(h => new THREE.Color(h).convertSRGBToLinear());
    for (let i = 0; i < pos.count; i++){
      const k = clamp(((pos.getX(i) - b.min.x) / (b.max.x - b.min.x) + (b.max.y - pos.getY(i)) / (b.max.y - b.min.y)) / 2) * (cs.length - 1);
      const j = Math.min(cs.length - 2, Math.floor(k)), c = cs[j].clone().lerp(cs[j + 1], k - j);
      col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
    }
    geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
  }
  return geo;
}

}

  REEL.cams.forEach(k => { const l = new THREE.PointLight(0xff3b2c, 3, 24, 2); l.position.set(k.c[0]-5, k.c[1]+4, k.c[2]+3); scene.add(l); });

/* ---------- câmera: órbita contínua + voos suaves entre cenas ---------- */
let CAM_T0 = [];
function orbit(k, t, t0){
  const a = k.a0 + (t - t0) * k.spin, R = k.R - (t - t0) * .18;
  return { pos:new THREE.Vector3(k.c[0] + Math.sin(a)*R, k.c[1] + k.h, k.c[2] + Math.cos(a)*R),
           tgt:new THREE.Vector3(k.c[0], k.c[1] + k.ty, k.c[2]) };
}
const pose = (ci, t) => orbit(REEL.cams[ci], t, CAM_T0[ci]);
function blend(a, b, k, lift, i){
  const e = smoother(k);
  return { pos:a.pos.lerp(b.pos, e).add(new THREE.Vector3(0, Math.sin(k * Math.PI) * lift, 0)), tgt:a.tgt.lerp(b.tgt, e),
           roll:Math.sin(k * Math.PI) * .06 * (i % 2 ? 1 : -1) };
}
function updateCamera(t){
  const S = REEL.scenes;
  let ci = 0; for (const s of S) if (t >= s.t0) ci = s.cam;
  let P = pose(ci, t); P.roll = 0;
  const I = REEL.intro, ki = (t - I.leave) / 1.35;
  if (ki < 1){ const O = orbit(I.cam, t, 0); P = ki <= 0 ? Object.assign(O, { roll:0 }) : blend(O, P, ki, 3, 1); }
  S.forEach((s, i) => {
    if (!i || s.cam === S[i-1].cam) return;
    const k = (t - (s.t0 - .6)) / 1.7;
    if (k > 0 && k < 1) P = blend(pose(S[i-1].cam, t), pose(s.cam, t), k, 4.5, i);
  });
  P.pos.x += Math.sin(t * 1.3) * .06 + Math.sin(t * 2.9) * .025;
  P.pos.y += Math.cos(t * 1.1) * .05 + Math.sin(t * 2.3) * .02;
  camera.position.copy(P.pos); camera.up.set(P.roll, 1, 0).normalize(); camera.lookAt(P.tgt);
}
function animate3D(t){
  A.dust.rotation.y = Math.sin(t * .05) * .02;
  const ci = eBack(clamp((t - .05) / 1.0));
  A.introLogo.scale.setScalar(Math.max(.001, ci));
  A.introLogo.rotation.set(Math.sin(t * .9) * .12, -Math.PI * 1.5 * (1 - eOut(clamp((t - .05) / 1.5))) + Math.sin(t * .8) * .35, REEL.intro.spinZ ? t * .15 : 0);
  A.introLogo.position.y = Math.sin(t * 1.4) * .12;
  A.introGlow.material.opacity = clamp(t * 2) * (.8 + .2 * Math.sin(t * 3));
  A.introRing.rotation.set(1.25 + Math.sin(t * .7) * .1, t * .4, 0); A.introRing.scale.setScalar(Math.max(.001, eOut(clamp((t - .3) / 1))));
  REEL.scenes.forEach(s => (s.parts || []).forEach(pt => pt.animate && pt.animate(t, s)));
  if (REEL.animate) REEL.animate(t);
}
function toScreen(obj, local){
  const v = obj.localToWorld(local.clone()).project(camera);
  return { x:(v.x * .5 + .5) * W, y:(-v.y * .5 + .5) * H };
}
function screenBox(obj, pts){
  const s = pts.map(q => toScreen(obj, new THREE.Vector3(...q)));
  return { x0:Math.min(...s.map(q => q.x)), x1:Math.max(...s.map(q => q.x)), y0:Math.min(...s.map(q => q.y)), y1:Math.max(...s.map(q => q.y)) };
}

/* ---------- 2D: tipografia e HUD ---------- */
function words(str){
  const out = []; let hl = false;
  for (const raw of str.split(" ")){
    if (raw.startsWith("*")) hl = true;
    out.push({ w:raw.replace(/\*/g, ""), hl });
    if (raw.slice(1).includes("*")) hl = false;
  }
  return out;
}
function layout(ctx, str, o){
  const ws = words(o.upper ? str.toUpperCase() : str), sp = o.size * .26, lines = [{ ws:[], w:0 }];
  for (const wd of ws){
    ctx.font = `${wd.hl ? 900 : o.weight} ${o.size}px ${SANS}`;
    const width = ctx.measureText(wd.w).width;
    let L = lines[lines.length - 1];
    if (L.ws.length && L.w + sp + width > o.maxW){ L = { ws:[], w:0 }; lines.push(L); }
    if (L.ws.length) L.w += sp;
    wd.x = L.w; L.ws.push(wd); L.w += width;
  }
  return lines;
}
function text(ctx, t, str, o){
  o = Object.assign({ x:X0, size:70, weight:800, maxW:MAXW, lh:1.04, upper:true, color:C2.ink, hl:C2.neonB, start:0, stagger:.1, dur:.75, align:"left" }, o);
  const lines = layout(ctx, str, o), lh = o.size * o.lh;
  ctx.letterSpacing = "0px"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  lines.forEach((L, i) => {
    const a = p(t, o.start + i * o.stagger, o.dur); if (a <= 0) return;
    const top = o.y + i * lh, ox = o.x + (o.align === "center" ? (o.maxW - L.w) / 2 : 0);
    ctx.save(); ctx.globalAlpha *= a;
    ctx.beginPath(); ctx.rect(0, top - o.size * .2, W, lh + o.size * .35); ctx.clip();
    ctx.translate(0, (1 - a) * lh);
    for (const wd of L.ws){
      ctx.font = `${wd.hl ? 900 : o.weight} ${o.size}px ${SANS}`;
      ctx.fillStyle = wd.hl ? o.hl : o.color; ctx.fillText(wd.w, ox + wd.x, top + o.size * .82);
    }
    ctx.restore();
  });
  return lines.length * lh;
}
function mono(ctx, str, x, y, o = {}){
  ctx.font = `${o.weight || 600} ${o.size || 24}px ${MONO}`; ctx.letterSpacing = (o.ls ?? 3) + "px";
  ctx.fillStyle = o.color || C2.mute; ctx.textAlign = o.align || "left"; ctx.textBaseline = "middle"; ctx.fillText(str, x, y);
  ctx.letterSpacing = "0px";
}
const typed = (str, t, start, cps = 32) => str.slice(0, Math.max(0, Math.floor((t - start) * cps)));
const caret = t => Math.floor(t * 3) % 2 ? "▌" : " ";
function tag(ctx, t, label, y, start){
  const a = p(t, start, .5); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  ctx.shadowColor = C2.neon; ctx.shadowBlur = 14 + 8 * Math.sin(t * 4); ctx.fillStyle = C2.neonB;
  ctx.beginPath(); ctx.arc(X0 + 7, y, Math.max(0, 7 * eBack(clamp((t - start) / .5))), 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  mono(ctx, typed("> " + label.toUpperCase(), t, start, 40) + caret(t), X0 + 30, y + 1, { size:24, ls:4 });
  ctx.restore();
}
function brackets(ctx, x0, y0, x1, y1, len, col, lw = 3){
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath();
  ctx.moveTo(x0, y0 + len); ctx.lineTo(x0, y0); ctx.lineTo(x0 + len, y0);
  ctx.moveTo(x1 - len, y0); ctx.lineTo(x1, y0); ctx.lineTo(x1, y0 + len);
  ctx.moveTo(x1, y1 - len); ctx.lineTo(x1, y1); ctx.lineTo(x1 - len, y1);
  ctx.moveTo(x0 + len, y1); ctx.lineTo(x0, y1); ctx.lineTo(x0, y1 - len);
  ctx.stroke();
}
// painel HUD: o título e o "sinal" ficam em lados opostos (área reservada pro selo à direita: right)
function hudPanel(ctx, x, y, w, h, title, t, right){
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 22); ctx.fillStyle = C2.panel; ctx.fill();
  ctx.strokeStyle = C2.line; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = C2.neonB; ctx.fillRect(x + 28, y, 90, 3);
  ctx.beginPath(); ctx.arc(x + 36, y + 40, 6, 0, 7); ctx.fill();
  mono(ctx, title, x + 56, y + 41, { size:21, ls:4, color:C2.ink, weight:700 });
  ctx.fillStyle = "rgba(244,239,233,.08)"; ctx.fillRect(x, y + 74, w, 1.5);
  for (let i = 0; i < 12; i++){
    const v = .3 + .7 * Math.abs(Math.sin(t * 3 + i * .9) * hash(i + Math.floor(t * 6)));
    ctx.fillStyle = i > 8 ? C2.neonB : "rgba(244,239,233,.35)"; ctx.fillRect(x + w - 40 - (11 - i) * 9, y + 50 - 24 * v, 5, 24 * v);
  }
  if (right) right(x + w - 160, y + 41); // selo opcional, termina antes das barras de sinal
}
function env(ctx, t, t0, t1, cx = W/2, cy = 700){
  const a = p(t, t0, .55), out = p(t, t1 - .4, .4, eInOut);
  if (a <= 0 || out >= 1) return false;
  const s = lerp(.94, 1, a) * (1 + .1 * out) * (1 + .03 * smoother(clamp((t - t0) / 10))); // aproximação lenta, no máximo 3%
  ctx.save(); ctx.globalAlpha = a * (1 - out);
  ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy);
  if (out > 0 && Q === 1) ctx.filter = `blur(${12 * out}px)`; // desfoque só no MP4 (na prévia pesa)
  return true;
}
// desenha uma logo vetorial 2D: paths = [{d, fill}] num viewBox vb, centralizada em (x,y) com tamanho size
function drawLogo(ctx, paths, vb, x, y, size, rot = 0, alpha = 1){
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(size / vb, size / vb); ctx.translate(-vb / 2, -vb / 2);
  paths.forEach(q => { q.p = q.p || new Path2D(q.d); ctx.fillStyle = typeof q.fill === "function" ? q.fill(ctx, vb) : q.fill; ctx.fill(q.p); });

// etiqueta (pílula) presa a um ponto da tela — normalmente projetado de um objeto 3D

  const iw = icon ? 40 : 0, w = ctx.measureText(txt).width + 44 + iw, yy = y - (1 - a) * 18;

  ctx.letterSpacing = "0px"; ctx.restore();

function drawLock(ctx, x, y, s, col = C2.ink){

  ctx.beginPath(); ctx.arc(x, y - s * .15, s * .32, Math.PI, 0); ctx.lineTo(x + s * .32, y + s * .05); ctx.moveTo(x - s * .32, y + s * .05); ctx.lineTo(x - s * .32, y - s * .15); ctx.stroke();

/* ---------- 2D: fluxograma / roadmap que se monta com a narração ----------
   nodes: [{ id, x, y, w, h, label, sub, cue, style:"hl"|"bad"|"", icon(ctx,cx,cy) }]
   edges: [{ a, b, cue, style:"bad"|"" }]  — linhas se desenham sozinhas e levam um pulso de dados */
function edgePath(A1, B1){
  const ax = A1.x + A1.w / 2, bx = B1.x + B1.w / 2;
  if (B1.y >= A1.y + A1.h - 1){ const y0 = A1.y + A1.h, y1 = B1.y, my = (y0 + y1) / 2; return ax === bx ? [[ax, y0], [bx, y1]] : [[ax, y0], [ax, my], [bx, my], [bx, y1]]; }
  const ay = A1.y + A1.h / 2, by = B1.y + B1.h / 2;
  return B1.x > A1.x ? [[A1.x + A1.w, ay], [B1.x, by]] : [[A1.x, ay], [B1.x + B1.w, by]];
}
function polyAt(pts, f){

async function buildMix(){

    venc.configure(vc);

}

  REEL.cams = [];
  REEL.scenes.forEach((s, i) => {
    if (s.cam === "same" && i){ s.cam = REEL.scenes[i - 1].cam; return; }
    const side = i % 2 ? 1 : -1, d = { c:[side * (i ? 24 : 0), 0, -36 * i], R:19, h:1.5, a0:-.25 * side, spin:.05 * side, ty:-2.2 };

      grp.add(body, facePlane(3, 4, cardTex(m.name, m.foot), .12)); grp.position.x = m.x; grp.rotation.y = -m.x * .06; g1.add(grp);
      return Object.assign(m, { grp, body, i });
    });
    // 2 e 4: formas wireframe atrás dos diagramas
    A.w2 = [wire(new THREE.TorusGeometry(6, 1.2, 8, 28), .22), wire(new THREE.IcosahedronGeometry(3.4, 1), .3)]; const g2 = group(camC(2)); A.w2.forEach(w => g2.add(w));
    A.w4 = [wire(new THREE.TorusGeometry(8, .2, 4, 60), .3), wire(new THREE.OctahedronGeometry(3.6, 0), .32)]; const g4 = group(camC(4)); A.w4.forEach(w => g4.add(w));
    // 3: estrela do Gemini que "apaga" quando o prazo vence
    A.g3 = group(camC(3));
    A.starMat = new THREE.MeshStandardMaterial({ vertexColors:true, metalness:.05, roughness:.42, emissive:new THREE.Color(0x000000), envMapIntensity:.35 });
    A.star = new THREE.Mesh(svgLogo3D(GEM_D, 65, 3.6, .5, GEM_STOPS), A.starMat);
    A.starGlow = glowPlane(11, "rgba(86,132,209,.35)"); A.starGlow.position.z = -1.4;
    A.g3.add(A.starGlow, A.star);
    // 5: a pergunta final
    A.g5 = group(camC(5));
    const bg = rcard(3.6, 4.8, .14, .32);
    const qTex = (kicker, lines, col, kcol) => canvasTex(720, 960, (x, w, h) => {
      x.font = `700 34px ${MONO}`; x.fillStyle = kcol; x.fillText(kicker, 56, 96);
      x.fillStyle = col; lines.forEach((l, i) => { fitFont(x, l, 900, 120, w - 112); x.fillText(l, 56, h - 80 - (lines.length - 1 - i) * 118); });
    });
    A.qa = new THREE.Group(); A.qa.add(new THREE.Mesh(bg, M.red), facePlane(3.6, 4.8, qTex("OPÇÃO A", ["VOU", "ASSINAR"], "#fff", "rgba(255,255,255,.8)"), .15));
    A.qb = new THREE.Group(); A.qb.add(new THREE.Mesh(bg, M.dark), facePlane(3.6, 4.8, qTex("OPÇÃO B", ["PRÓXIMA", "IA GRÁTIS"], "#9c9088", "#d94a3a"), .15));
    A.qa.position.x = -2.15; A.qb.position.x = 2.15; A.g5.add(A.qa, A.qb);
    A.qmark = text3D("?", 1.8, M.ink); A.qmark.position.set(0, 3.1, -1.2); A.g5.add(A.qmark);
  },

  animate(t){
    const S = REEL.scenes;
    // 0
    const d0 = at("nove") - .45;
    A.date.visible = t > d0 - .05;
    A.date.scale.setScalar(Math.max(.001, eBack(clamp((t - d0) / .9))));
    A.date.rotation.y = -1.4 * (1 - eOut(clamp((t - d0) / 1.5))) + Math.sin(t * .7) * .25;
    A.date.position.y = Math.sin(t * 1.2) * .15;
    A.orb.forEach(o => { const a = o.ph + t * o.sp; o.m.position.set(Math.cos(a) * o.r, o.y + Math.sin(t * .8 + o.ph) * .4, Math.sin(a) * o.r * .6); o.m.rotation.set(t * .7 + o.ph, t * .5, 0); });
    // 1
    A.models.forEach(m => {
      const inn = eBack(clamp((t - S[1].t0 - .15 - m.i * .15) / .6));
      const lock = m.free ? 0 : eInOut(clamp((t - m.cue) / .6));
      m.grp.scale.setScalar(Math.max(.001, inn) * (m.free && t > m.cue ? 1 + .06 * eBack(clamp((t - m.cue) / .4)) : 1));
      m.grp.rotation.x = -.45 * lock; m.grp.position.z = -1.6 * lock; m.grp.position.y = Math.sin(t * 1.1 + m.i) * .1;
      m.body.material = m.free ? (t > m.cue ? M.red : M.dark) : (lock > .3 ? M.dead : M.dark);
    });
    // 2 / 4
    A.w2[0].rotation.set(t * .12, t * .18, 0); A.w2[1].rotation.set(-t * .2, t * .1, 0);
    A.w4[0].rotation.set(1.1, t * .12, t * .05); A.w4[1].rotation.set(t * .15, -t * .2, 0);
    // 3: a estrela perde a cor quando o prazo vence
    const s3 = eBack(clamp((t - S[3].t0) / .9)), dead = eInOut(clamp((t - at("validade") + .1) / .6));
    A.star.scale.setScalar(Math.max(.001, s3));
    A.star.rotation.set(Math.sin(t * .8) * .1, t * .6 + (dead > 0 && dead < 1 ? (hash(Math.floor(t * 30)) - .5) * .3 : 0), 0);
    A.starMat.color.setRGB(lerp(1, .22, dead), lerp(1, .22, dead), lerp(1, .22, dead));
    
    A.starGlow.material.opacity = (1 - dead) * (.8 + .2 * Math.sin(t * 3));
    // 5
    const qa = eOut(clamp((t - S[5].t0 - .2) / 1)), qb = eOut(clamp((t - at("ou") + .1) / 1)), qm = eBack(clamp((t - at("próxima") + .1) / .6));
    A.qa.visible = t > S[5].t0 + .2; A.qb.visible = t > at("ou") - .1;
    A.qa.rotation.y = .2 + (1 - qa) * Math.PI * .9 + Math.sin(t * 1.3) * .05;
    A.qb.rotation.y = -.2 - (1 - qb) * Math.PI * .9 + Math.sin(t * 1.3 + 1) * .05;
    A.qa.position.y = Math.sin(t * 1.4) * .12; A.qb.position.y = Math.sin(t * 1.4 + 1.5) * .12;
    A.qmark.visible = t > at("próxima") - .1; A.qmark.scale.setScalar(Math.max(.001, qm)); A.qmark.rotation.y = Math.sin(t * 1.5) * .5;
  },

  draw2D(ctx, t){
    const S = REEL.scenes;
    // 0: aviso do Google + mira na data
    const gp = at("google") - .3;
    if (env(ctx, t, gp, S[1].t0, W/2, 380)){
      hudPanel(ctx, X0, 290, MAXW, 172, "ATUALIZAÇÃO // GOOGLE", t);
      gIcon(46)(ctx, X0 + 56, 412);
      ctx.font = `800 36px ${SANS}`; ctx.fillStyle = C2.ink; ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText(typed("NOVAS REGRAS DO GEMINI", t, gp + .2, 34), X0 + 100, 400);
      mono(ctx, typed("EM VIGOR DESDE 09.10.2026", t, gp + .7, 34), X0 + 100, 438, { size:19, ls:3, color:C2.neonB, weight:700 });
      ctx.restore();
    }
    const lk = at("nove") - .2;
    if (t > lk && t < S[1].t0){
      const b = screenBox(A.g0, [[-2.9, -1.3, 0], [2.9, 1.3, 0]]), k = p(t, lk, .8), out = p(t, S[1].t0 - .4, .3);
      const x0 = lerp(70, b.x0 - 30, k), x1 = lerp(W - 70, b.x1 + 30, k), y0 = lerp(490, b.y0 - 30, k), y1 = lerp(1080, b.y1 + 30, k);
      ctx.save(); ctx.globalAlpha = clamp((t - lk) * 4) * (1 - out);
      brackets(ctx, x0, y0, x1, y1, 44, k > .98 ? C2.neonB : "rgba(244,239,233,.7)", 4);
      if (k > .98) mono(ctx, typed("DATA DA MUDANÇA // 09.10.2026", t, lk + .8, 30), x0, y1 + 32, { size:21, color:C2.neonB, weight:700 });
      ctx.restore();
    }
    // 1: etiquetas e cadeados nos modelos
    if (between(t, S[1].t0, S[2].t0)){
      const out = 1 - p(t, S[2].t0 - .4, .35);
      A.models.forEach(m => {
        if (t < m.cue) return;
        const a = p(t, m.cue, .35) * out, pt = toScreen(m.grp, new THREE.Vector3(0, -2.55, 0));
        chip(ctx, pt.x, pt.y + 26, m.free ? "GRÁTIS" : "ASSINANTES", a, m.free, m.free ? null : (c, x, y) => drawLock(c, x, y - 8, 22, "#fff"));
        if (!m.free){ const c = toScreen(m.grp, new THREE.Vector3(0, -.95, .2)), s = eBack(clamp((t - m.cue) / .4));
          ctx.save(); ctx.globalAlpha = a; ctx.translate(c.x, c.y); ctx.scale(s, s); ctx.shadowColor = "rgba(0,0,0,.8)"; ctx.shadowBlur = 20; drawLock(ctx, 0, -20, 76, C2.ink); ctx.restore(); }
      });
    }
    // 2: roadmap dos planos (monta conforme a fala)
    if (env(ctx, t, S[2].t0, S[2].t1, W/2, 680)){
      hudPanel(ctx, X0, 285, MAXW, 790, "PLANOS DO GEMINI // DESDE 09.10", t, (x, y) => gIcon(36)(ctx, x, y));
      const nx = X0 + 40, nw = MAXW - 80;
      drawGraph(ctx, t, {
        nodes:[
          { id:"free", x:nx, y:385, w:nw, h:118, label:"Gratuito",        sub:"SÓ FLASH-LITE",              cue:at("funciona") + .35, icon:gemIcon(52) },
          { id:"plus", x:nx, y:563, w:nw, h:118, label:"Google AI Plus",  sub:"FLASH-LITE + FLASH",         cue:at("plâs") - .3,      icon:gemIcon(52) },
          { id:"pro",  x:nx, y:741, w:nw, h:118, label:"AI Pro · Ultra",  sub:"FLASH-LITE + FLASH + PRO",   cue:at("pro", 2) - .3,    icon:gemIcon(52), style:"hl" },
          { id:"deep", x:nx + 164, y:925, w:nw - 328, h:106, label:"+ Deep Think", sub:"MODO DE RACIOCÍNIO", cue:at("dip") - .2, style:"hl", size:32 },
        ],
        edges:[
          { a:"free", b:"plus", cue:at("plâs") - .55 },
          { a:"plus", b:"pro",  cue:at("pro", 2) - .55 },
          { a:"pro",  b:"deep", cue:at("dip") - .45 },
        ],
      });
      ctx.restore();
    }
    // 3: contagem regressiva do "grátis"
    if (between(t, S[3].t0, S[4].t0)){
      const c = toScreen(A.g3, new THREE.Vector3(0, 0, 0)), a = p(t, S[3].t0, .5) * (1 - p(t, S[4].t0 - .45, .4));
      const end = at("validade"), left = 1 - clamp((t - S[3].t0 - .3) / (end - S[3].t0 - .3)), r = 330;
      ctx.save(); ctx.globalAlpha = a;
      ctx.strokeStyle = "rgba(244,239,233,.1)"; ctx.lineWidth = 14; ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, 7); ctx.stroke();
      ctx.strokeStyle = left > 0 ? C2.neonB : C2.mute; ctx.shadowColor = C2.neonB; ctx.shadowBlur = left > 0 ? 20 : 0;
      ctx.beginPath(); ctx.arc(c.x, c.y, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * left); ctx.stroke(); ctx.shadowBlur = 0;
      for (let i = 0; i < 60; i++){ const an = i / 60 * Math.PI * 2, r2 = i % 5 ? r + 26 : r + 36;
        ctx.strokeStyle = i / 60 < left ? "rgba(244,239,233,.5)" : "rgba(244,239,233,.12)"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(c.x + Math.cos(an - Math.PI / 2) * (r + 18), c.y + Math.sin(an - Math.PI / 2) * (r + 18)); ctx.lineTo(c.x + Math.cos(an - Math.PI / 2) * r2, c.y + Math.sin(an - Math.PI / 2) * r2); ctx.stroke(); }
      mono(ctx, "ACESSO GRÁTIS  ·  00:0" + Math.ceil(left * 9), c.x, c.y - r - 62, { align:"center", size:24, ls:5, color:left > 0 ? C2.ink : C2.neonB, weight:700 });
      stamp(ctx, t, end - .05, "EXPIRADO", c.x, c.y + 10, -.14);
      ctx.restore();
    }
    // 4: fluxograma do risco
    if (env(ctx, t, S[4].t0, S[4].t1, W/2, 680)){
      hudPanel(ctx, X0, 285, MAXW, 790, "O RISCO // DEPENDER SÓ DO GRÁTIS", t);
      const L = X0 + 40, Rr = X0 + MAXW - 40 - 560;
      drawGraph(ctx, t, {
        nodes:[
          { id:"a", x:L,  y:385, w:560, h:110, label:"Ferramenta grátis", cue:S[4].t0 + .25,       icon:gemIcon(48) },
          { id:"b", x:Rr, y:550, w:560, h:110, label:"As regras mudam",   cue:at("mudam") - .2,    icon:gIcon(44) },
          { id:"c", x:L,  y:715, w:560, h:110, label:"Você perde acesso", cue:at("depende") - .2,  icon:(c, x, y) => drawLock(c, x, y - 12, 34, C2.mute), style:"bad" },
          { id:"d", x:Rr, y:880, w:560, h:110, label:"Fica pra trás",     cue:at("trás") - .35,    style:"hl" },
        ],
        edges:[
          { a:"a", b:"b", cue:at("mudam") - .45 },
          { a:"b", b:"c", cue:at("depende") - .45 },
          { a:"c", b:"d", cue:at("trás") - .6 },
        ],
      });
      ctx.restore();
    }
    // 5: selo "VS" entre as opções
    if (t > at("ou") + .2){
      const c = toScreen(A.g5, new THREE.Vector3(0, 0, 1)), s = eBack(clamp((t - at("ou") - .2) / .4));
      ctx.save(); ctx.globalAlpha = clamp((t - at("ou") - .2) * 4) * (1 - p(t, END - .8, .5)); ctx.translate(c.x, c.y); ctx.scale(s, s);
      ctx.beginPath(); ctx.arc(0, 0, 46, 0, 7); ctx.fillStyle = C2.ground; ctx.fill(); ctx.strokeStyle = C2.neonB; ctx.lineWidth = 3; ctx.shadowColor = C2.neonB; ctx.shadowBlur = 24; ctx.stroke(); ctx.shadowBlur = 0;
      mono(ctx, "VS", 0, 2, { align:"center", size:26, weight:700, color:C2.neonB, ls:2 }); ctx.restore();
    }
  },
};

boot();
</script>
